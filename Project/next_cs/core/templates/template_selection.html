{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="{% static 'image/Next-cs logo.png' %}" type="image/x-icon">
    <title>Next-CS |Select Resume Template</title>
    <link rel="stylesheet" href="{% static 'css/template_selection.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav>
            <div class="profile">
                <img src="{{ user_data.profile_pic|default:'/static/image/default_profile_pic.jpg' }}" alt="Profile Picture">
                <span>{{ user_data.username }}</span>
            </div>
            <div class="menu">
                <button class="menu-btn">☰</button>
                <ul class="dropdown">
                    <li><a href="{% url 'dashboard' %}">Dashboard</a></li>
                    <li><a href="{% url 'learning_hub' %}">Learning Hub</a></li>
                    <li><a href="#">Quiz Hub</a></li>
                    <li><a href="{% url 'job_search' %}">Job Search</a></li>
                    <li><a href="{% url 'new-connections' %}">Connect Campus</a></li>
                    <li><a href="{% url 'logout' %}">Logout</a></li>
                </ul>
            </div>
        </nav>
    </header>
    <h2>Select a Resume Template</h2>
    <div class="template-grid">
        {% for i in "123456"|make_list %}
        <div class="template-card">
            <img src="{% static 'image/template' %}{{ i }}.png" alt="Template {{ i }}">
            <form method="POST" action="{% url 'generate_resume_pdf' %}">
                {% csrf_token %}
                <input type="hidden" name="template_id" value="1">
                <div class="text-center mt-2">
                    <button type="submit" class="btn btn-success">Use this Template</button>
                </div>
            </form>
            
        </div>
        {% endfor %}
    </div>
    <footer class=" text-light text-center p-3">
        <p>&copy; 2025 Next-CS. All rights reserved.</p>
        <div class="social-icons">
            <a href="#"><i class="bi bi-facebook me-2"></i></a>
            <a href="#"><i class="bi bi-twitter me-2"></i></a>
            <a href="#"><i class="bi bi-linkedin me-2"></i></a>
            <a href="#"><i class="bi bi-instagram"></i></a>
        </div>
    </footer>
</body>
</html>
